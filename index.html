<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkHive – Find Work. Find Talent.</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#0A2472;--accent:#F5B700;--bg:#fff;--card:#f4f6fb;--text:#14182b;--muted:#5a6280;--line:#dde1ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c36;--text:#eef0f8;--muted:#a3abc9;--brand:#5b7ae6;--line:#2a3358}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c36;--text:#eef0f8;--muted:#a3abc9;--brand:#5b7ae6;--line:#2a3358}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:8px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.3rem;color:var(--brand);cursor:pointer}.logo span{color:var(--accent)}
.nl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:600 .88rem Poppins,sans-serif;cursor:pointer}
.btn.o{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.s{padding:5px 12px;font-size:.8rem}
.hero{text-align:center;padding:40px 0 24px}
h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.2;margin:0 0 10px;color:var(--brand)}
h2{color:var(--brand);margin:28px 0 12px}
.muted{color:var(--muted);font-size:.88rem;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--line)}
.card h3{margin:0 0 2px;font-size:1.02rem}
.tag{display:inline-block;background:var(--accent);color:#14182b;border-radius:20px;padding:1px 10px;font-size:.74rem;font-weight:600;margin:6px 6px 0 0}
.tag.g{background:var(--line);color:var(--text)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;width:100%}
.bar input,.bar select{flex:1;min-width:130px;width:auto}
label{display:block;font-size:.82rem;font-weight:600;margin:10px 0 3px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:var(--bg);border-radius:14px;padding:22px;max-width:480px;width:100%;max-height:90%;overflow:auto}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:24px;font-size:.85rem;z-index:10}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.stat{font-size:1.6rem;font-weight:700;color:var(--accent)}
footer{margin:48px 0 16px;text-align:center;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:16px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCLVAy3vZA0K6Hh2x_5tXP5JlYYJp_wehk",
  authDomain: "workhive-7fade.firebaseapp.com",
  projectId: "workhive-7fade",
  storageBucket: "workhive-7fade.firebasestorage.app",
  messagingSenderId: "689980789111",
  appId: "1:689980789111:web:b5c2fec9beaf1711299172"
};
firebase.initializeApp(firebaseConfig);
const A=firebase.auth(),DB=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
let S={me:null,jobs:[],saved:{},apps:[],view:"home",f:{q:"",type:"",loc:"",cat:""},tab:"saved",modal:null,toast:""},unsubs=[],pending=null;
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(v){S.view=v;S.modal=null;render();scrollTo(0,0)}
function say(m){S.toast=m;render();setTimeout(()=>{S.toast="";render()},2600)}
function need(role){if(!S.me){S.modal={k:"auth",m:"login"};render();return false}
if(role&&S.me.role!==role){say("Switch to a "+role+" account for this");return false}return true}
DB.collection("jobs").orderBy("created","desc").onSnapshot(s=>{S.jobs=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>say("Could not load jobs"));
A.onAuthStateChanged(async u=>{unsubs.forEach(f=>f());unsubs=[];S.apps=[];
if(!u){S.me=null;render();return}
const ref=DB.collection("users").doc(u.uid);let d=await ref.get();
if(!d.exists&&pending){await ref.set(pending);d=await ref.get()}
if(!d.exists){await A.signOut();return}
S.me={uid:u.uid,email:u.email,...d.data()};S.saved[u.email]=S.me.saved||[];
const q=S.me.role==="employer"?DB.collection("applications").where("employer","==",u.email):DB.collection("applications").where("uid","==",u.uid);
unsubs.push(q.onSnapshot(s=>{S.apps=s.docs.map(x=>x.data());render()}));render()});
async function auth(mode){const e=$("#ae").value.trim().toLowerCase(),p=$("#ap").value;
if(!e.includes("@")||p.length<6){say("Enter a valid email and a 6+ character password");return}
try{if(mode==="signup"){pending={name:$("#an").value.trim()||e.split("@")[0],role:$("#ar").value,skills:"",email:e,saved:[]};await A.createUserWithEmailAndPassword(e,p)}
else await A.signInWithEmailAndPassword(e,p);S.modal=null;render()}catch(x){say(x.code==="auth/email-already-in-use"?"Email already registered":x.code==="auth/invalid-credential"?"Wrong email or password":x.message)}}
async function reset(){const e=$("#ae").value.trim();if(!e){say("Type your email first");return}try{await A.sendPasswordResetEmail(e);say("Reset link sent. Check your email")}catch(x){say(x.message)}}
function logout(){A.signOut();go("home")}
function save1(id){if(!need("seeker"))return;const a=S.saved[S.me.email]=S.saved[S.me.email]||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);DB.collection("users").doc(S.me.uid).update({saved:a});render()}
async function apply(id){if(!need("seeker"))return;if(S.apps.find(a=>a.jobId===id&&a.email===S.me.email)){say("Already applied");return}
const j=S.jobs.find(x=>x.id===id),cv=($("#cv")?.value||"").trim();
try{await DB.collection("applications").doc(id+"_"+S.me.uid).set({jobId:id,jobTitle:j.t,uid:S.me.uid,email:S.me.email,name:S.me.name,skills:S.me.skills||"",cv:cv.startsWith("https://")?cv:"",note:($("#note")?.value||"").slice(0,1000),employer:j.by,date:new Date().toLocaleDateString(),created:TS()});S.modal=null;render();say("Application sent!")}catch(x){say("Could not send: "+x.message)}}
async function post(){const g=i=>$("#"+i).value.trim();if(!g("jt")||!g("jco")||!g("jd")){say("Fill title, company and description");return}
try{await DB.collection("jobs").add({t:g("jt"),co:g("jco"),loc:g("jl")||"Remote",type:$("#jty").value,cat:g("jc")||"General",pay:g("jp")||"Negotiable",d:g("jd"),req:g("jr")||"-",by:S.me.email,uid:S.me.uid,created:TS()});go("dash");say("Job posted")}catch(x){say("Could not post: "+x.message)}}
function del(id){if(confirm("Remove this job?"))DB.collection("jobs").doc(id).delete()}
function jobCard(j){const sv=(S.saved[S.me?.email]||[]).includes(j.id);
return `<div class="card"><h3>${esc(j.t)}</h3><p class="muted">${esc(j.co)} · ${esc(j.loc)}</p><span class="tag">${esc(j.type)}</span><span class="tag g">${esc(j.cat)}</span><p class="muted" style="margin-top:8px">${esc(j.pay)}</p>
<div class="row"><button class="btn s" onclick="S.modal={k:'job',id:'${j.id}'};render()">Details</button><button class="btn s o" onclick="save1('${j.id}')">${sv?"★ Saved":"☆ Save"}</button></div></div>`}
function filtered(){const f=S.f,q=f.q.toLowerCase();return S.jobs.filter(j=>(!q||(j.t+j.co+j.cat+j.req).toLowerCase().includes(q))&&(!f.type||j.type===f.type)&&(!f.loc||(f.loc==="Remote"?j.loc==="Remote":j.loc!=="Remote"))&&(!f.cat||j.cat===f.cat))}
function setF(k,v){S.f[k]=v;render();const el=$("#f_"+k);if(el&&el.tagName==="INPUT"){el.focus();el.setSelectionRange(v.length,v.length)}}
function navbar(){return `<nav><div class="logo" onclick="go('home')">Work<span>Hive</span></div><div class="nl"><button class="btn s o" onclick="go('jobs')">Jobs</button>
${S.me?`${S.me.role==="employer"?`<button class="btn s o" onclick="go('post')">Post a job</button>`:""}<button class="btn s o" onclick="go('dash')">Dashboard</button><button class="btn s" onclick="logout()">Log out</button>`:`<button class="btn s o" onclick="S.modal={k:'auth',m:'login'};render()">Log in</button><button class="btn s" onclick="S.modal={k:'auth',m:'signup'};render()">Sign up</button>`}</div></nav>`}
function jobsView(list,title){const cats=[...new Set(S.jobs.map(j=>j.cat))];
return `<h2>${title}</h2><div class="bar"><input id="f_q" placeholder="Search title, company, skill" value="${esc(S.f.q)}" oninput="setF('q',this.value)">
<select onchange="setF('type',this.value)"><option value="">All types</option>${["Full-time","Part-time","Contract"].map(t=>`<option ${S.f.type===t?"selected":""}>${t}</option>`).join("")}</select>
<select onchange="setF('loc',this.value)"><option value="">Any location</option><option ${S.f.loc==="Remote"?"selected":""}>Remote</option><option value="On-site" ${S.f.loc==="On-site"?"selected":""}>On-site</option></select>
<select onchange="setF('cat',this.value)"><option value="">All categories</option>${cats.map(c=>`<option ${S.f.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
<div class="grid">${list.length?list.map(jobCard).join(""):'<p class="muted">No jobs yet. Check back soon, or employers can sign up and post one.</p>'}</div>`}
function home(){return `<section class="hero"><h1>Where the right talent meets the right work</h1><p class="muted" style="max-width:520px;margin:0 auto 18px">Find remote and local jobs that fit your skills, or post a role and hire faster.</p>
<div class="row" style="justify-content:center"><button class="btn" onclick="go('jobs')">Browse jobs</button><button class="btn o" onclick="S.me?go(S.me.role==='employer'?'post':'dash'):(S.modal={k:'auth',m:'signup'},render())">${S.me?.role==="employer"?"Post a job":"Create profile"}</button></div></section>
<div class="grid"><div class="card"><div class="stat">${S.jobs.length}</div><p class="muted">Open jobs</p></div><div class="card"><div class="stat">${S.jobs.filter(j=>j.loc==="Remote").length}</div><p class="muted">Remote roles</p></div><div class="card"><div class="stat">${new Set(S.jobs.map(j=>j.co)).size}</div><p class="muted">Hiring companies</p></div></div>
<h2>How it works</h2><div class="grid"><div class="card"><div class="stat">1</div><h3>Create your account</h3><p class="muted">Sign up as a job seeker or employer.</p></div><div class="card"><div class="stat">2</div><h3>Search or post</h3><p class="muted">Filter jobs, or list a role in minutes.</p></div><div class="card"><div class="stat">3</div><h3>Apply &amp; hire</h3><p class="muted">Apply with a note; employers see applicants.</p></div></div>
<h2>Latest jobs</h2><div class="grid">${S.jobs.slice(0,4).map(jobCard).join("")}</div>`}
function postView(){if(!S.me||S.me.role!=="employer")return `<p class="muted" style="margin-top:30px">Log in with an employer account to post jobs.</p>`;
return `<h2>Post a job</h2><div class="card"><label>Job title</label><input id="jt"><label>Company</label><input id="jco" value="${esc(S.me.name)}"><label>Location</label><input id="jl" placeholder="Remote, Lagos…"><label>Type</label><select id="jty"><option>Full-time</option><option>Part-time</option><option>Contract</option></select>
<label>Category</label><input id="jc" placeholder="Data, Admin, Design…"><label>Pay</label><input id="jp" placeholder="$500/mo"><label>Description</label><textarea id="jd" rows="4"></textarea><label>Requirements</label><input id="jr"><div class="row"><button class="btn" onclick="post()">Publish job</button></div></div>`}
function dash(){if(!S.me)return `<p class="muted" style="margin-top:30px">Please log in.</p>`;
if(S.me.role==="employer"){const mine=S.jobs.filter(j=>j.by===S.me.email);
return `<h2>${esc(S.me.name)}'s dashboard</h2><p class="muted">Your job postings and applicants</p><div class="row"><button class="btn s" onclick="go('post')">+ Post a job</button></div>
<div class="grid" style="margin-top:12px">${mine.length?mine.map(j=>{const a=S.apps.filter(x=>x.jobId===j.id);return `<div class="card"><h3>${esc(j.t)}</h3><p class="muted">${a.length} applicant(s)</p>${a.map(x=>`<p class="muted" style="margin-top:6px">• <b>${esc(x.name)}</b> (${esc(x.email)}) – ${esc(x.date)}${x.skills?`<br>Skills: ${esc(x.skills)}`:""}${x.cv?`<br><a href="${esc(x.cv)}" target="_blank" rel="noopener" style="color:var(--brand)">View CV</a>`:""}${x.note?`<br>"${esc(x.note)}"`:""}</p>`).join("")}<div class="row"><button class="btn s o" onclick="del('${j.id}')">Remove</button></div></div>`}).join(""):'<p class="muted">No postings yet.</p>'}</div>`}
const ids=S.saved[S.me.email]||[],mineA=S.apps.filter(a=>a.email===S.me.email);
return `<h2>Hi ${esc(S.me.name)}</h2><label>Your skills (helps you remember what to highlight)</label><input value="${esc(S.me.skills||"")}" placeholder="Excel, data entry, bookkeeping" onchange="S.me.skills=this.value;DB.collection('users').doc(S.me.uid).update({skills:this.value});say('Profile updated')">
<div class="tabs" style="margin-top:14px"><button class="btn s ${S.tab==="saved"?"":"o"}" onclick="S.tab='saved';render()">Saved (${ids.length})</button><button class="btn s ${S.tab==="apps"?"":"o"}" onclick="S.tab='apps';render()">Applications (${mineA.length})</button></div>
<div class="grid">${S.tab==="saved"?(ids.length?S.jobs.filter(j=>ids.includes(j.id)).map(jobCard).join(""):'<p class="muted">Nothing saved yet.</p>'):(mineA.length?mineA.map(a=>{const j=S.jobs.find(j=>j.id===a.jobId);return `<div class="card"><h3>${esc(j?j.t:"Removed job")}</h3><p class="muted">${esc(j?j.co:"")} · applied ${esc(a.date)}</p><span class="tag">Submitted</span></div>`}).join(""):'<p class="muted">No applications yet.</p>')}</div>`}
function modal(){const m=S.modal;if(!m)return "";
if(m.k==="auth"){const su=m.m==="signup";return `<div class="modal" onclick="if(event.target===this){S.modal=null;render()}"><div class="box"><h2 style="margin-top:0">${su?"Create account":"Log in"}</h2>
${su?`<label>Name</label><input id="an"><label>I am a</label><select id="ar"><option value="seeker">Job seeker</option><option value="employer">Employer</option></select>`:""}<label>Email</label><input id="ae" type="email"><label>Password</label><input id="ap" type="password">
<div class="row"><button class="btn" onclick="auth('${su?"signup":"login"}')">${su?"Sign up":"Log in"}</button><button class="btn o" onclick="S.modal={k:'auth',m:'${su?"login":"signup"}'};render()">${su?"Have an account?":"New here?"}</button></div>
${su?"":`<p class="muted" style="margin-top:10px"><a href="#" onclick="reset();return false" style="color:var(--brand)">Forgot password?</a></p>`}</div></div>`}
const j=S.jobs.find(x=>x.id===m.id);if(!j)return "";const done=S.me&&S.apps.find(a=>a.jobId===j.id&&a.email===S.me.email);
return `<div class="modal" onclick="if(event.target===this){S.modal=null;render()}"><div class="box"><h2 style="margin-top:0">${esc(j.t)}</h2><p class="muted">${esc(j.co)} · ${esc(j.loc)} · ${esc(j.pay)}</p><span class="tag">${esc(j.type)}</span><span class="tag g">${esc(j.cat)}</span>
<p>${esc(j.d)}</p><p class="muted"><b>Requirements:</b> ${esc(j.req)}</p>${done?'<span class="tag">Applied ✓</span>':`<label>Link to your CV (optional, https://…)</label><input id="cv" placeholder="Google Drive / Dropbox link"><label>Short note to employer</label><textarea id="note" rows="3"></textarea><div class="row"><button class="btn" onclick="apply('${j.id}')">Apply now</button><button class="btn o" onclick="S.modal=null;render()">Close</button></div>`}</div></div>`}
function render(){const v=S.view;$("#app").innerHTML=navbar()+(v==="home"?home():v==="jobs"?jobsView(filtered(),"All jobs"):v==="post"?postView():dash())+`<footer>© 2026 WorkHive</footer>`+modal()+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:"");
if(v==="jobs"&&document.activeElement===document.body){}}
render();
</script></body></html>
